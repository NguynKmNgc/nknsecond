<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a3d8f">
<title>File Explorer - Windows 10</title>
<style>
    /* =========================================================
       RESET & BIẾN CHUNG
       ========================================================= */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        width: 100%;
        height: 100%;
    }

    body {
        font-family: "Segoe UI", "Segoe UI Variable", system-ui, -apple-system,
                     "Helvetica Neue", Roboto, Arial, sans-serif;
        font-size: 13px;
        color: #1b1b1b;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(ellipse 70% 55% at 28% 38%, rgba(120, 200, 255, 0.42), transparent 65%),
            radial-gradient(ellipse 60% 50% at 72% 68%, rgba(0, 110, 220, 0.55), transparent 65%),
            radial-gradient(ellipse 80% 70% at 50% 50%, rgba(0, 60, 140, 0.35), transparent 70%),
            linear-gradient(135deg, #001129 0%, #00306b 45%, #001a3d 100%);
    }

    /* =========================================================
       CỬA SỔ WINDOWS
       ========================================================= */
    .window {
        width: 100%;
        height: 100%;
        max-width: 1440px;
        max-height: 920px;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08);
        animation: windowIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes windowIn {
        from { opacity: 0; transform: scale(0.97) translateY(14px); }
        to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    @media (min-width: 900px) {
        body { padding: 22px; }
        .window { border-radius: 9px; }
    }

    /* =========================================================
       THANH TIÊU ĐỀ
       ========================================================= */
    .titlebar {
        height: 32px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #ffffff;
        border-bottom: 1px solid #ececec;
        padding-left: 12px;
        user-select: none;
    }

    .titlebar-left {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
    }

    .titlebar-icon {
        width: 17px;
        height: 17px;
        flex-shrink: 0;
    }

    .titlebar-icon svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    .window-title {
        font-size: 12px;
        color: #333333;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .titlebar-controls {
        display: flex;
        height: 100%;
        flex-shrink: 0;
    }

    .tb-btn {
        width: 46px;
        height: 100%;
        border: none;
        background: transparent;
        color: #444444;
        font-size: 11px;
        font-family: "Segoe UI Symbol", "Segoe UI", sans-serif;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s ease, color 0.15s ease;
    }

    .tb-btn:hover {
        background: #e9e9e9;
    }

    .tb-btn.close:hover {
        background: #e81123;
        color: #ffffff;
    }

    /* =========================================================
       DẢI TAB LỆNH
       ========================================================= */
    .tabrow {
        height: 30px;
        flex-shrink: 0;
        display: flex;
        align-items: flex-end;
        gap: 2px;
        background: #f5f6f7;
        padding: 0 6px;
        border-bottom: 1px solid #e6e6e6;
        overflow-x: auto;
        scrollbar-width: none;
        user-select: none;
    }

    .tabrow::-webkit-scrollbar { display: none; }

    .ribbon-tab {
        padding: 5px 14px 6px;
        font-size: 12px;
        font-weight: 500;
        color: #333333;
        background: transparent;
        border: none;
        border-radius: 4px 4px 0 0;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s ease;
    }

    .ribbon-tab:hover {
        background: #e7e9eb;
    }

    .ribbon-tab.active {
        background: #ffffff;
        color: #0078d7;
        font-weight: 600;
        box-shadow: 0 -1px 0 #e6e6e6, -1px 0 0 #e6e6e6, 1px 0 0 #e6e6e6;
    }

    /* =========================================================
       THANH LỆNH (RIBBON RÚT GỌN)
       ========================================================= */
    .commandbar {
        height: 42px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 8px;
        background: #f5f6f7;
        border-bottom: 1px solid #e0e0e0;
        overflow-x: auto;
        scrollbar-width: none;
        user-select: none;
    }

    .commandbar::-webkit-scrollbar { display: none; }

    .cmd-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        font-size: 12px;
        font-family: inherit;
        color: #2b2b2b;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 4px;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background 0.15s ease, border-color 0.15s ease;
    }

    .cmd-btn:hover {
        background: #e5f3ff;
        border-color: #b8ddf7;
    }

    .cmd-btn:active {
        background: #cce8ff;
    }

    .cmd-icon {
        font-size: 14px;
        line-height: 1;
    }

    .cmd-sep {
        width: 1px;
        height: 22px;
        background: #dcdcdc;
        margin: 0 5px;
        flex-shrink: 0;
    }

    /* =========================================================
       THANH ĐIỀU HƯỚNG
       ========================================================= */
    .navbar {
        height: 40px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 8px;
        background: #ffffff;
        border-bottom: 1px solid #e6e6e6;
    }

    .nav-btn {
        width: 30px;
        height: 30px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        color: #444444;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
    }

    .nav-btn:hover:not(:disabled) {
        background: #e5f3ff;
        border-color: #c2e0f7;
    }

    .nav-btn:disabled {
        color: #c0c0c0;
        cursor: default;
    }

    .menu-toggle {
        display: none;
    }

    /* Thanh địa chỉ */
    .addressbar {
        flex: 1;
        min-width: 0;
        height: 30px;
        display: flex;
        align-items: center;
        gap: 1px;
        padding: 0 6px;
        background: #ffffff;
        border: 1px solid #d6d6d6;
        border-radius: 4px;
        overflow-x: auto;
        scrollbar-width: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .addressbar::-webkit-scrollbar { display: none; }

    .addressbar:focus-within {
        border-color: #0078d7;
        box-shadow: 0 0 0 1px #0078d7 inset;
    }

    .crumb {
        padding: 3px 7px;
        font-size: 12px;
        font-family: inherit;
        color: #1b1b1b;
        background: transparent;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background 0.15s ease;
    }

    .crumb:hover {
        background: #e5f3ff;
    }

    .crumb.active {
        font-weight: 600;
        color: #0078d7;
    }

    .crumb-sep {
        font-size: 11px;
        color: #9a9a9a;
        flex-shrink: 0;
        padding: 0 1px;
        user-select: none;
    }

    /* Ô tìm kiếm */
    .searchbox {
        position: relative;
        width: 190px;
        flex-shrink: 0;
    }

    .searchbox input {
        width: 100%;
        height: 30px;
        padding: 0 30px 0 10px;
        font-size: 12px;
        font-family: inherit;
        color: #1b1b1b;
        background: #ffffff;
        border: 1px solid #d6d6d6;
        border-radius: 4px;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .searchbox input::placeholder {
        color: #9a9a9a;
    }

    .searchbox input:focus {
        border-color: #0078d7;
        box-shadow: 0 0 0 1px #0078d7 inset;
    }

    .searchbox .search-icon {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 13px;
        color: #8a8a8a;
        pointer-events: none;
    }

    /* =========================================================
       THÂN CỬA SỔ
       ========================================================= */
    .body {
        flex: 1;
        min-height: 0;
        display: flex;
        position: relative;
        background: #ffffff;
    }

    /* ---------- Sidebar ---------- */
    .sidebar {
        width: 224px;
        flex-shrink: 0;
        background: #f5f6f7;
        border-right: 1px solid #e6e6e6;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 6px 0 14px;
        scrollbar-width: thin;
        scrollbar-color: #c8c8c8 transparent;
        user-select: none;
    }

    .sidebar::-webkit-scrollbar { width: 8px; }
    .sidebar::-webkit-scrollbar-thumb {
        background: #c8c8c8;
        border-radius: 8px;
        border: 2px solid #f5f6f7;
    }

    .side-title {
        padding: 8px 14px 5px;
        font-size: 11.5px;
        font-weight: 700;
        color: #6b6b6b;
        letter-spacing: 0.2px;
    }

    .side-item {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 6px 12px;
        font-size: 12.5px;
        color: #2b2b2b;
        border-radius: 4px;
        margin: 0 6px 1px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        transition: background 0.15s ease;
    }

    .side-item:hover {
        background: #e5f3ff;
    }

    .side-item.active {
        background: #cce8ff;
        font-weight: 600;
    }

    .side-item-icon {
        width: 17px;
        height: 17px;
        flex-shrink: 0;
    }

    .side-item-icon svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    .side-item-label {
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .side-divider {
        height: 1px;
        background: #e2e2e2;
        margin: 7px 14px;
    }

    /* ---------- Vùng nội dung ---------- */
    .content {
        flex: 1;
        min-width: 0;
        overflow-y: auto;
        overflow-x: hidden;
        background: #ffffff;
        scrollbar-width: thin;
        scrollbar-color: #c8c8c8 transparent;
        position: relative;
    }

    .content::-webkit-scrollbar { width: 10px; }
    .content::-webkit-scrollbar-thumb {
        background: #c8c8c8;
        border-radius: 10px;
        border: 3px solid #ffffff;
    }
    .content::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

    /* ---------- Chế độ xem TILES ---------- */
    .view-tiles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
        gap: 2px;
        padding: 12px;
        animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .item {
        position: relative;
        cursor: default;
        user-select: none;
        border: 1px solid transparent;
        border-radius: 5px;
        transition: background 0.12s ease, border-color 0.12s ease;
    }

    .tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 6px 8px;
        min-height: 106px;
        text-align: center;
    }

    .tile:hover {
        background: #e5f3ff;
        border-color: #c2e0f7;
    }

    .tile.selected {
        background: #cce8ff;
        border-color: #99d1ff;
    }

    .tile.selected:hover {
        background: #b8dfff;
    }

    .tile-icon {
        width: 48px;
        height: 48px;
        flex-shrink: 0;
        margin-bottom: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
    }

    .tile-icon svg {
        width: 100%;
        height: 100%;
        display: block;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.13));
    }

    .tile-name {
        font-size: 12px;
        line-height: 1.35;
        color: #1b1b1b;
        word-break: break-word;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        max-width: 100%;
        pointer-events: none;
    }

    /* Ô đĩa có thanh dung lượng */
    .drive-tile {
        min-height: 138px;
    }

    .drive-meter {
        width: 88%;
        height: 11px;
        margin-top: 8px;
        background: #e6e6e6;
        border: 1px solid #cfcfcf;
        border-radius: 3px;
        overflow: hidden;
        flex-shrink: 0;
    }

    .drive-meter-fill {
        height: 100%;
        background: linear-gradient(180deg, #4aa8f0, #0078d7);
        border-radius: 2px;
        transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .drive-meter.warning .drive-meter-fill {
        background: linear-gradient(180deg, #ffc44d, #f0a000);
    }

    .drive-meter.critical .drive-meter-fill {
        background: linear-gradient(180deg, #ff6b6b, #d9342b);
    }

    .drive-info {
        margin-top: 5px;
        font-size: 10.5px;
        color: #5c5c5c;
        line-height: 1.3;
        pointer-events: none;
    }

    /* ---------- Chế độ xem DETAILS ---------- */
    .view-details {
        padding: 4px 0 20px;
        animation: fadeIn 0.25s ease;
    }

    .details-row {
        display: flex;
        align-items: center;
        height: 27px;
        padding: 0 12px;
        font-size: 12.5px;
        color: #1b1b1b;
        border: 1px solid transparent;
        border-radius: 3px;
        cursor: default;
        user-select: none;
        transition: background 0.1s ease;
    }

    .details-row:hover {
        background: #e5f3ff;
        border-color: #c2e0f7;
    }

    .details-row.selected {
        background: #cce8ff;
        border-color: #99d1ff;
    }

    .details-header {
        position: sticky;
        top: 0;
        z-index: 5;
        height: 26px;
        background: #ffffff;
        border-bottom: 1px solid #e6e6e6;
        border-radius: 0;
        font-size: 11.5px;
        font-weight: 600;
        color: #5c5c5c;
        cursor: default;
    }

    .details-header:hover {
        background: #ffffff;
        border-color: transparent;
        border-bottom-color: #e6e6e6;
    }

    .col-name {
        flex: 1 1 46%;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding-right: 10px;
    }

    .col-date {
        flex: 0 0 20%;
        min-width: 0;
        padding-right: 10px;
        color: #5c5c5c;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .col-type {
        flex: 0 0 20%;
        min-width: 0;
        padding-right: 10px;
        color: #5c5c5c;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .col-size {
        flex: 0 0 14%;
        min-width: 0;
        text-align: right;
        color: #5c5c5c;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .row-icon {
        width: 17px;
        height: 17px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .row-icon svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    .row-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* ---------- Thư mục trống ---------- */
    .empty-folder {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        min-height: 260px;
        gap: 12px;
        color: #8a8a8a;
        animation: fadeIn 0.3s ease;
    }

    .empty-folder-icon {
        width: 72px;
        height: 72px;
        opacity: 0.4;
    }

    .empty-folder-icon svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    .empty-folder p {
        font-size: 13px;
    }

    /* =========================================================
       THANH TRẠNG THÁI
       ========================================================= */
    .statusbar {
        height: 26px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        background: #f5f6f7;
        border-top: 1px solid #e6e6e6;
        font-size: 11.5px;
        color: #5c5c5c;
        user-select: none;
    }

    .status-left {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
    }

    .status-right {
        display: flex;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
    }

    .view-btn {
        width: 26px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: #5c5c5c;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 3px;
        cursor: pointer;
        transition: background 0.15s ease;
    }

    .view-btn:hover {
        background: #e5f3ff;
    }

    .view-btn.active {
        background: #cce8ff;
        border-color: #99d1ff;
        color: #0078d7;
    }

    /* =========================================================
       TOAST
       ========================================================= */
    .toast-container {
        position: fixed;
        bottom: 26px;
        right: 26px;
        z-index: 9999;
        display: flex;
        flex-direction: column-reverse;
        gap: 10px;
        pointer-events: none;
        max-width: calc(100% - 40px);
    }

    .toast {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 18px;
        font-size: 13px;
        font-weight: 500;
        color: #1b1b1b;
        background: #ffffff;
        border: 1px solid #dcdcdc;
        border-left: 4px solid #0078d7;
        border-radius: 6px;
        box-shadow: 0 10px 34px rgba(0, 0, 0, 0.22);
        opacity: 0;
        transform: translateX(30px) scale(0.96);
        transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .toast.show {
        opacity: 1;
        transform: translateX(0) scale(1);
    }

    .toast.warn {
        border-left-color: #f0a000;
    }

    .toast-icon {
        font-size: 16px;
        line-height: 1;
        flex-shrink: 0;
    }

    /* =========================================================
       LỚP PHỦ SIDEBAR TRÊN MOBILE
       ========================================================= */
    .sidebar-overlay {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: 40;
        opacity: 0;
        transition: opacity 0.25s ease;
    }

    .sidebar-overlay.show {
        display: block;
        opacity: 1;
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */
    @media (max-width: 820px) {
        .menu-toggle {
            display: flex;
        }

        .sidebar {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 50;
            transform: translateX(-100%);
            transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 6px 0 24px rgba(0, 0, 0, 0.18);
            width: 250px;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .searchbox {
            width: 132px;
        }

        .view-tiles {
            grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
            padding: 8px;
        }

        .tile-icon {
            width: 42px;
            height: 42px;
        }

        .col-date,
        .col-type {
            display: none;
        }

        .col-name {
            flex: 1 1 70%;
        }

        .col-size {
            flex: 0 0 28%;
        }
    }

    @media (max-width: 560px) {
        .tabrow {
            display: none;
        }

        .commandbar {
            height: 38px;
            padding: 0 5px;
        }

        .cmd-btn {
            padding: 6px 8px;
            font-size: 11.5px;
        }

        .cmd-text {
            display: none;
        }

        .cmd-icon {
            font-size: 15px;
        }

        .navbar {
            height: 38px;
            gap: 2px;
            padding: 0 5px;
        }

        .searchbox {
            width: 40px;
        }

        .searchbox input {
            padding: 0 8px 0 8px;
            font-size: 0;
        }

        .searchbox input::placeholder {
            font-size: 12px;
            color: transparent;
        }

        .searchbox .search-icon {
            right: 50%;
            transform: translate(50%, -50%);
        }

        .searchbox.expanded {
            position: absolute;
            left: 5px;
            right: 5px;
            width: auto;
            z-index: 60;
        }

        .searchbox.expanded input {
            font-size: 12px;
            padding: 0 30px 0 10px;
        }

        .searchbox.expanded input::placeholder {
            color: #9a9a9a;
        }

        .searchbox.expanded .search-icon {
            right: 8px;
            transform: translateY(-50%);
        }

        .view-tiles {
            grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
            gap: 1px;
            padding: 6px;
        }

        .tile {
            min-height: 96px;
            padding: 8px 4px 6px;
        }

        .tile-icon {
            width: 38px;
            height: 38px;
            margin-bottom: 5px;

// Số nguyên ngẫu nhiên trong khoảng [min, max]
function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

// Chọn ngẫu nhiên một phần tử trong mảng
function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

// Thêm số 0 ở đầu cho đủ 2 chữ số
function pad2(n) {
    return String(n).padStart(2, "0");
}

// Sinh ngày sửa đổi ngẫu nhiên trong vòng 400 ngày qua
function randomModified() {
    const now = Date.now();
    const past = now - 400 * 24 * 60 * 60 * 1000;
    const t = past + Math.random() * (now - past);
    const d = new Date(t);
    return pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + "/" + d.getFullYear() +
           " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}

// Định dạng kích thước (đầu vào là KB)
function formatSize(kb) {
    if (kb === undefined || kb === null || isNaN(kb)) return "";
    if (kb <= 0) return "0 KB";
    if (kb < 1024) return Math.round(kb) + " KB";

    const mb = kb / 1024;
    if (mb < 1024) {
        const val = (mb < 10) ? mb.toFixed(1) : Math.round(mb);
        return String(val).replace(".", ",") + " MB";
    }

    const gb = mb / 1024;
    const rounded = Math.round(gb * 100) / 100;
    const text = Number.isInteger(rounded)
        ? String(rounded)
        : rounded.toFixed(2).replace(".", ",");
    return text + " GB";
}

// Chống lỗi XSS khi chèn chuỗi vào HTML
function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
        if (c === "&") return "&amp;";
        if (c === "<") return "&lt;";
        if (c === ">") return "&gt;";
        if (c === '"') return "&quot;";
        return "&#39;";
    });
}

function makeFile(kind) {
    const k = KINDS[kind];
    const ext = pick(k.exts);
    const base = pick(k.names);
    const suffix = pick(SUFFIXES);
    const size = randInt(k.sizes[0], k.sizes[1]);

    return {
        id: fileIdCounter++,
        name: base + suffix + "." + ext,
        type: "file",
        kind: kind,
        ext: ext,
        size: size,
        modified: randomModified()
    };
}

function makeFolder(name, children) {
    return {
        id: fileIdCounter++,
        name: name,
        type: "folder",
        children: children || [],
        modified: randomModified()
    };
}

function makeDrive(name, letter, capacityGB, usedGB, children) {

        id: fileIdCounter++,
        name: name,
        type: "drive",
        letter: letter,
        capacity: capacityGB * GB,
        used: usedGB * GB,
        children: children || [],
        modified: randomModified()
    };
}

function manyFiles(kinds, count) {
    const out = [];

    const out = [];
    for (let i = 1; i <= count; i++) {

function showToast(message, type) {
    const toast = document.createElement("div");
    toast.className = "toast" + (type === "warn" ? " warn" : "");

    const icon = document.createElement("span");
    icon.className = "toast-icon";
    icon.textContent = type === "warn" ? "⚠️" : "ℹ️";

    const text = document.createElement("span");
    text.textContent = message;

    toast.appendChild(icon);
    toast.appendChild(text);
    toastContainer.appendChild(toast);

    requestAnimationFrame(function () {
        toast.classList.add("show");
    });

    setTimeout(function () {
        toast.classList.remove("show");
        setTimeout(function () {
            if (toast.parentNode) {
                toast.parentNode.removeChild(toast);
            }
        }, 320);
    }, 2600);
}

// Lấy icon HTML cho một node
function getIconHTML(node) {
    if (!node) return SVG_FOLDER;
    if (node.type === "root") return SVG_THISPC;
    if (node.type === "drive") return SVG_DRIVE;
    if (node.type === "folder") return SVG_FOLDER;

    const kind = node.kind || "txt";
    const info = KINDS[kind];
    return fileSVG(info ? info.color : "#607D8B");
}

// Lấy nhãn loại cho một node
function getTypeLabel(node) {
    if (!node) return "";
    if (node.type === "root") return "Thư mục";
    if (node.type === "drive") return "Ổ đĩa cục bộ";
    if (node.type === "folder") return "Thư mục tệp";

    const kind = node.kind || "txt";
    const info = KINDS[kind];
    return info ? info.label : "Tệp";
}

// Xóa lựa chọn hiện tại
function clearSelection() {
    if (selectedElement && selectedElement.parentNode) {
        selectedElement.classList.remove("selected");
    }
    selectedElement = null;
}

// Đóng sidebar trên mobile
function closeSidebar() {
    sidebar.classList.remove("open");
    sidebarOverlay.classList.remove("show");
}

// Mở sidebar trên mobile
function openSidebar() {
    sidebar.classList.add("open");
    sidebarOverlay.classList.add("show");
}


/* =========================================================
   PHẦN 9: ĐIỀU HƯỚNG
   ========================================================= */

// Cập nhật trạng thái các nút điều hướng
function updateNavButtons() {
    btnBack.disabled = backStack.length === 0;
    btnForward.disabled = forwardStack.length === 0;
    btnUp.disabled = currentPath.length <= 1;
}

// Đặt đường dẫn mới (không ghi vào lịch sử)
function setPath(newPath) {
    currentPath = newPath;
    searchQuery = "";
    searchInput.value = "";
    render();
}

// Mở một thư mục con (ghi vào lịch sử)
function openNode(node) {
    if (!node) return;
    if (node.type === "file") return;

    backStack.push(currentPath.slice());
    forwardStack = [];
    currentPath = currentPath.concat([node]);
    searchQuery = "";
    searchInput.value = "";
    clearSelection();
    render();
}

// Lùi lại
function goBack() {
    if (backStack.length === 0) return;
    forwardStack.push(currentPath.slice());
    currentPath = backStack.pop();
    searchQuery = "";
    searchInput.value = "";
    clearSelection();
    render();
}

// Tiến tới
function goForward() {
    if (forwardStack.length === 0) return;
    backStack.push(currentPath.slice());
    currentPath = forwardStack.pop();
    searchQuery = "";
    searchInput.value = "";
    clearSelection();
    render();
}

// Lên thư mục cha
function goUp() {
    if (currentPath.length <= 1) return;
    backStack.push(currentPath.slice());
    forwardStack = [];
    currentPath = currentPath.slice(0, currentPath.length - 1);
    searchQuery = "";
    searchInput.value = "";
    clearSelection();
    render();
}

// Điều hướng theo chiều sâu trong breadcrumb
function navigateToDepth(depth) {
    if (depth < 0 || depth >= currentPath.length) return;
    if (depth === currentPath.length - 1) return;

    backStack.push(currentPath.slice());
    forwardStack = [];
    currentPath = currentPath.slice(0, depth + 1);
    searchQuery = "";
    searchInput.value = "";
    clearSelection();
    render();
}

// Điều hướng tới một node bất kỳ từ sidebar
function navigateToNode(node) {
    if (!node) return;
    if (node === FS) {
        backStack.push(currentPath.slice());
        forwardStack = [];
        currentPath = [FS];
    } else {
        backStack.push(currentPath.slice());
        forwardStack = [];
        currentPath = [FS, node];
    }
    searchQuery = "";
    searchInput.value = "";
    clearSelection();
    closeSidebar();
    render();
}

// Tìm node theo tên trong This PC
function findRootChild(name) {
    for (let i = 0; i < FS.children.length; i++) {
        if (FS.children[i].name === name) {
            return FS.children[i];
        }
    }
    return null;
}

// Hàm render tổng
function render() {
    renderTitleBar();
    renderBreadcrumb();
    renderSidebar();
    renderContent();
    renderStatusBar();
    updateNavButtons();
}

// Thanh tiêu đề
function renderTitleBar() {
    const node = currentPath[currentPath.length - 1];
    windowTitle.textContent = node.name;
    titlebarIcon.innerHTML = getIconHTML(node);
}

// Breadcrumb trên thanh địa chỉ
function renderBreadcrumb() {
    addressBar.innerHTML = "";

    currentPath.forEach(function (node, index) {
        if (index > 0) {
            const sep = document.createElement("span");
            sep.className = "crumb-sep";
            sep.textContent = "›";
            addressBar.appendChild(sep);
        }

        const crumb = document.createElement("button");
        crumb.type = "button";
        crumb.className = "crumb";
        crumb.textContent = node.name;

        if (index === currentPath.length - 1) {
            crumb.classList.add("active");
        }

        crumb.addEventListener("click", function () {
            navigateToDepth(index);
        });

        addressBar.appendChild(crumb);
    });
}
